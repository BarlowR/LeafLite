; leaflite — minimal vario firmware for Leaf 3.2.3 hardware
; Scope: baro + piezo audio + GPS + IGC logging to SD + BLE (LK8EX1/NMEA to phone apps)
; Killed vs upstream: display (U8g2/Adafruit), FANET/LoRa (RadioLib), WiFi/OTA/webserver,
;   ArduinoJson, ETL, magic_enum, TinyGPS++, TCA9555, IMU, temp/humidity, XMLWriter.
; Sole external dependency: NimBLE-Arduino. Everything else is the arduino-esp32 core.

[platformio]
default_envs = leaflite_3_2_3

[env:leaflite_3_2_3]
; Same pioarduino platform pin as upstream Leaf — known-good with this hardware.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.10/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608

monitor_speed = 115200

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -Wall
    ; TinyUSB OTG mode: required for USB mass storage (SD card as a USB drive).
    ; CDC_ON_BOOT must be 0: with it set, the core calls USB.begin() before
    ; setup() and an MSC interface added later never enumerates. main.cpp
    ; starts USBSerial + USB itself (and aliases Serial to USBSerial so debug
    ; stays off UART0, which belongs to the GPS).
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0

lib_deps =
    h2zero/NimBLE-Arduino@2.2.3
